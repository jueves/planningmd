services:
  api:
    build: .
    ports:
      - "3002:3001"
    env_file:
      - ${ENV_SENSITIVE}
      - .env
    volumes:
      - ./quotes.md:/planningmd/quotes.md
      - ./pdfs:/planningmd/pdfs
    restart: unless-stopped
    networks:
      - default
      # Shared network with the CUPS server container (same host).
      # Create it once with: docker network create printing
      # and attach the cups service to it too. Then CUPS_SERVER=cups.
      - printing

networks:
  printing:
    external: true
